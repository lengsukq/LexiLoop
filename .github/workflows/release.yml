# 仓库默认分支是 main（旧 Next.js 版），Flutter 应用在 flutter 分支。
# GitHub 的「Run workflow」按钮只读取默认分支上的 workflow，
# 所以本文件放在 main；构建时 checkout 到 inputs.source_ref（默认 flutter）。
name: Build Release (Android / macOS)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "构建平台：all / android / macos"
        required: true
        type: choice
        default: all
        options:
          - all
          - android
          - macos
      source_ref:
        description: "Flutter 代码 ref（默认 flutter）"
        required: true
        default: flutter
        type: string
      build_number:
        description: "构建号（Android versionCode / macOS CFBundleVersion）；留空使用 run number"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.platform }}-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android APK
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Resolve dependencies
        run: flutter pub get

      - name: Restore Android signing material
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 GitHub Secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::缺少 GitHub Secret: ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          if [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "::error::缺少 GitHub Secret: ANDROID_KEY_ALIAS"
            exit 1
          fi
          if [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::缺少 GitHub Secret: ANDROID_KEY_PASSWORD"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/lexiloop-release.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=lexiloop-release.jks\n'
          } > android/key.properties
          chmod 600 android/app/lexiloop-release.jks android/key.properties
          keytool -list \
            -keystore android/app/lexiloop-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::build_number 必须是纯数字，当前为 '$BUILD_NUMBER'"
            exit 1
          fi
          flutter build apk --release --build-number "$BUILD_NUMBER" --no-pub
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Verify signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner"
            exit 1
          fi
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" --version || true
          EXPECTED="$(keytool -list -v \
            -keystore android/app/lexiloop-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | sed -n -E 's/.*SHA-?256[^:]*: *//p' \
            | head -n 1 | tr -d ':\r' | tr '[:upper:]' '[:lower:]')"
          APKSIGNER_OUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)" || {
            printf '%s\n' "$APKSIGNER_OUT"
            echo "::error::apksigner verify 失败"
            exit 1
          }
          printf '%s\n' "$APKSIGNER_OUT"
          ACTUAL="$(printf '%s\n' "$APKSIGNER_OUT" \
            | sed -n -E 's/.*SHA-?256 digest: *//p' \
            | head -n 1 | tr -d ':\r' | tr '[:upper:]' '[:lower:]')"
          printf 'keystore SHA-256: %s\napk signer SHA-256: %s\n' "$EXPECTED" "$ACTUAL"
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::APK 签名与固定 keystore 不一致"
            exit 1
          fi

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | cut -d+ -f1)"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/LexiLoop-${VERSION}-${BUILD_NUMBER}-android.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LexiLoop-Android-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  macos:
    name: macOS app
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Toolchain info
        run: |
          uname -m
          xcodebuild -version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build macOS app
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::build_number 必须是纯数字，当前为 '$BUILD_NUMBER'"
            exit 1
          fi
          flutter build macos --release --build-number "$BUILD_NUMBER" --no-pub

      - name: Verify ad-hoc signature
        shell: bash
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/lexiloop.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | sed -n '1,12p'

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | cut -d+ -f1)"
          APP="build/macos/Build/Products/Release/lexiloop.app"
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/lexiloop" | tr ' ' '-')"
          echo "macOS architectures: $ARCHS"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" \
            "dist/LexiLoop-${VERSION}-${BUILD_NUMBER}-macos-${ARCHS}.zip"

      - name: Upload macOS zip
        uses: actions/upload-artifact@v4
        with:
          name: LexiLoop-macOS-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 90
          overwrite: true
