services:
  app:
    build:
      context: .
      target: app
    container_name: lexiloop-app
    restart: unless-stopped
    init: true
    ports:
      - "${LEXILOOP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      DATABASE_PATH: /app/data/app.sqlite
      BACKUP_DIR: /app/data/backups
      ECDICT_DATABASE_PATH: /app/data/reference/ecdict.sqlite
      BACKGROUND_ENGINE_ENABLED: ${BACKGROUND_ENGINE_ENABLED:-true}
      BACKGROUND_ENGINE_ID: ${BACKGROUND_ENGINE_ID:-lexiloop-app-engine}
      BACKGROUND_CONCURRENCY: ${BACKGROUND_CONCURRENCY:-2}
      BACKGROUND_POLL_INTERVAL_MS: ${BACKGROUND_POLL_INTERVAL_MS:-1000}
      WORKER_STALE_AFTER_MS: ${WORKER_STALE_AFTER_MS:-30000}
      DICTIONARY_API_ENABLED: ${DICTIONARY_API_ENABLED:-true}
      MYMEMORY_ENABLED: ${MYMEMORY_ENABLED:-true}
      ECDICT_ENABLED: ${ECDICT_ENABLED:-false}
      LEXILOOP_ADMIN_TOKEN: ${LEXILOOP_ADMIN_TOKEN:-}
    volumes:
      - ./data:/app/data
