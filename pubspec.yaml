name: lexiloop
description: LexiLoop 词环 — 纯本地、Android 与 macOS 双端的词汇复习应用。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # ── 数据层 ──
  # drift >= 2.32 配合 sqlite3 3.x 会通过 Dart build hooks 自动打包 SQLite，
  # 因此不再需要 sqlite3_flutter_libs（该包自 0.6.0 起已废弃且不含任何代码）。
  csv: ^8.0.0
  drift: ^2.35.2
  path: ^1.9.1
  path_provider: ^2.1.6

  # ── 状态与路由 ──
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  riverpod_annotation: ^4.0.7

  # ── 网络 ──
  dio: ^5.11.1

  # ── 学习引擎 ──
  fsrs: ^2.0.1
  unorm_dart: ^0.3.3

  # ── 音频与发音 ──
  # macOS 的 flutter_tts 不支持 synthesizeToFile，差异由 PlatformCaps 收敛。
  flutter_tts: ^4.2.5
  just_audio: ^0.10.6

  # ── UI ──
  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  lucide_icons_flutter: ^3.1.25

  # ── 平台能力 ──
  # macOS 上不加 keychain-access-groups，改用 usesDataProtectionKeychain: false，
  # 否则 Xcode 会切到 Managed Profile 导致无法分发。
  file_picker: ^13.1.0
  flutter_secure_storage: ^11.2.0
  share_plus: ^13.3.1
  window_manager: ^0.5.2

  # ── 序列化 ──
  freezed_annotation: ^3.1.0
  intl: ^0.20.3
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  # 210 条规则的严格超集（含全部关键 Flutter 规则），取代 flutter_lints。
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
