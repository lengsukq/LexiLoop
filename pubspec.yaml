name: lexiloop
description: LexiLoop 词环 — 纯本地、Android 与 macOS 双端的词汇复习应用。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # ── 数据层 ──
  # drift >= 2.32 配合 sqlite3 3.x 会通过 Dart build hooks 自动打包 SQLite，
  # 因此不再需要 sqlite3_flutter_libs（该包自 0.6.0 起已废弃且不含任何代码）。
  csv: ^8.0.0
  drift: ^2.35.2
  path: ^1.9.1
  path_provider: ^2.1.6

  # ── 状态与路由 ──
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # ── 网络 ──
  dio: ^5.11.1
  # WebDAV 的 PROPFIND/MKCOL 响应是 XML；按 local name 解析以兼容各服务
  # 不同的命名空间前缀。此前只是传递依赖（drift_dev → xml），
  # 这里显式声明，避免上游换实现时静默消失。
  xml: ^7.0.1

  # ── 学习引擎 ──
  fsrs: ^2.0.1
  unorm_dart: ^0.3.3

  # ── 音频与发音 ──
  # macOS 的 flutter_tts 不支持 synthesizeToFile，差异由 PlatformCaps 收敛。
  flutter_tts: ^4.2.5
  just_audio: ^0.10.6

  # ── UI ──
  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  lucide_icons_flutter: ^3.1.25

  # ── 平台能力 ──
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 只用于生成 drift 的 `database.g.dart`；模型全部手写，没有 freezed /
  # json_serializable / riverpod_generator 的代码生成。
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  mocktail: ^1.0.5
  # 备份交付的测试要替换「临时目录」与「分享面板」的平台实现——
  # `flutter test` 进程里没有原生插件，不替换就只能抛 MissingPluginException。
  # `file_picker` 的接口由 `package:file_picker/file_picker.dart` 直接 re-export，
  # 因此不需要单列。
  path_provider_platform_interface: ^2.1.3
  share_plus_platform_interface: ^7.2.0
  # 210 条规则的严格超集（含全部关键 Flutter 规则），取代 flutter_lints。
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
